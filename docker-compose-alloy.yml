services:
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    user: root
    environment:
      - NODE_NAME=${HOSTNAME}
    # network_mode: host for standalone alloy
    pid: host
    volumes:
      - type: volume
        source: alloy_data
        target: /var/lib/alloy/data
      - type: bind
        source: ./config/alloy
        target: /etc/alloy
      - type: bind
        source: /var/log
        target: /var/log
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /
        target: /host/rootfs
        read_only: true
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
    ports:
      - 127.0.0.1:12345:12345
    command:
      - "run"
      - "--server.http.listen-addr=127.0.0.1:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    networks:
      - loki
      - caddy_network # remove if not using caddy

networks:
  loki:
    driver: bridge
  caddy_network: # remove if not using caddy
    external: true

volumes:
  alloy_data:
    # optional if you don't care about big uptime
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ALLOY_VOLUME_PATH}
