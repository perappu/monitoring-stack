services:
  alloy:
    image: grafana/alloy:latest
    container-name: alloy
    restart: unless-stopped
    user: root
    environment:
      - NODE_NAME=${HOSTNAME}
    network_mode: host
    pid: host
    volumes:
      - ./config/alloy:/etc/alloy
      - alloy_data:/var/lib/alloy/data
      - type: bind
        source: /var/log
        target: /var/log
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /
        target: /host/rootfs
        read_only: true
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
    ports:
      - 12345:12345
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    networks:
      - loki

networks:
  loki:
    driver: bridge

volume:
  alloy_data:
    # super optional, only really need driver/driver opts on the host machine
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ALLOY_VOLUME_PATH}