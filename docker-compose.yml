services:
  # grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_FEATURE_TOGGLES_ENABLE=alertingSimplifiedRouting,alertingQueryAndExpressionsStepMode
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}
      - GF_SERVER_DOMAIN=${GRAFANA_SERVER_DOMAIN}
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning/:/etc/grafana/provisioning
      - ./config/grafana/grafana.ini:/etc/grafana/grafana.ini
    networks:
      - loki
      - caddy_network # remove if not using caddy

  # loki for logs
  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    restart: unless-stopped
    volumes:
      - ./config/loki:/etc/loki
      - loki_data:/loki
    ports:
    - 127.0.0.1:3100:3100
    command: -config.file=/etc/loki/loki-config.yml
    networks:
    - loki
    - caddy_network # remove if not using caddy

  # prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      - prometheus_data:/prometheus
      - ./config/prometheus/prometheus.yml:/prometheus/prometheus.yml
    command:
      - "--web.enable-remote-write-receiver"
    networks:
      - loki
      - caddy_network # remove if not using caddy

volumes:
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${GRAFANA_VOLUME_PATH}
  loki_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LOKI_VOLUME_PATH}
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PROMETHEUS_VOLUME_PATH}

networks:
  loki:
    driver: bridge
  caddy_network: # remove if not using caddy
    external: true